name: ci

on:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on errors only; warnings (e.g. files over 400 lines) are hints.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The email worker is its own package; its tests ran nowhere before.
      - name: Test email worker
        working-directory: workers/job-alerts
        run: npm ci && npm test && npm run typecheck

      - name: Build application
        run: npm run build

  # Logs in, creates an application and changes its status in a real browser
  # against the built app and a throwaway database.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Builds the production image and starts it: catches an image that builds
  # but can't start, e.g. a server import missing from the runtime stage.
  image-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vita:ci
          cache-from: type=gha

      - name: Start the image and check it serves
        run: sh scripts/smoke-test-image.sh vita:ci
