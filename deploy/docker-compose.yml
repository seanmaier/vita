# Portainer stack: Stacks → Add stack → Repository (this file), or paste it.
# After the first deploy, create a user from the container's console:
#   node server/cli.ts add <username>
#
# No port is published: the app joins an existing Docker network that your
# reverse proxy / tunnel container is in, and is reachable there as
#   http://vita:3000
# (also as http://job-applications:3000, its name before the rename, until
# proxies have moved over).
#
# Before the first deploy, create the data volume once on the host. It is
# external so that `docker compose down -v` or removing the stack never
# deletes the database:
#   docker volume create job-applications-data
# Docker can't rename volumes, so the default keeps the name from before
# the app was called Vita; existing deployments need no change.
#
# Daily backups go to a second external volume, created the same way:
#   docker volume create vita-backups
# deploy/vita-backup.sh creates, lists and restores them (see the README).
#
# Stack environment variables (set them in Portainer, not here):
#   PROXY_NETWORK  required, name of that existing Docker network
#   DATA_VOLUME    optional, defaults to job-applications-data
#   BACKUP_VOLUME  optional, defaults to vita-backups
#   LOG_LEVEL      optional, debug | info | warn | error, defaults to info
#   INBOUND_DOMAIN optional, the domain the email worker's catch-all receives
#                  mail for (e.g. alerts.example.org); job alerts are off
#                  while it is unset
services:
  app:
    image: ghcr.io/seanmaier/vita:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INBOUND_DOMAIN: ${INBOUND_DOMAIN:-}
    volumes:
      - app-data:/data
      - backups:/backups
    networks:
      proxy:
        aliases:
          - vita
          - job-applications

volumes:
  app-data:
    external: true
    name: ${DATA_VOLUME:-job-applications-data}
  backups:
    external: true
    name: ${BACKUP_VOLUME:-vita-backups}

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK to the Docker network of your reverse proxy}
